<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CityFlow – Route Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://tile.openstreetmap.org">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/cityflow.css?v=6">
</head>
<body>

<!-- ── Header ───────────────────────────────────────────── -->
<header class="header">
    <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <polygon points="14,2 26,8 26,20 14,26 2,20 2,8" stroke="#00E5FF" stroke-width="1.5" fill="none"/>
            <circle cx="14" cy="14" r="4" fill="#00E5FF"/>
            <line x1="14" y1="2"  x2="14" y2="10" stroke="#00E5FF" stroke-width="1"/>
            <line x1="14" y1="18" x2="14" y2="26" stroke="#00E5FF" stroke-width="1"/>
            <line x1="2"  y1="8"  x2="9"  y2="12" stroke="#00E5FF" stroke-width="1"/>
            <line x1="19" y1="16" x2="26" y2="20" stroke="#00E5FF" stroke-width="1"/>
            <line x1="26" y1="8"  x2="19" y2="12" stroke="#00E5FF" stroke-width="1"/>
            <line x1="9"  y1="16" x2="2"  y2="20" stroke="#00E5FF" stroke-width="1"/>
        </svg>
        <span class="logo-text">CityFlow</span>
        <span class="logo-sub">DEHRADUN</span>
    </div>
    <div class="header-status">
        <span class="pulse-ring"></span>
        <span id="status-text">LOADING…</span>
        <span class="divider">|</span>
        <span id="clock">--:--:--</span>
    </div>
</header>

<!-- ── Main Layout ──────────────────────────────────────── -->
<div class="app-layout">

    <!-- Panel -->
    <aside class="panel">

        <!-- Search Form -->
        <div class="search-card">
            <div class="search-title">
                <span class="search-title-icon">⬡</span>
                FIND YOUR TRANSPORT
            </div>

            <!-- FROM -->
            <div class="input-group">
                <label class="input-label">
                    <span class="stop-marker from-marker">A</span>
                    FROM
                </label>
                <div class="autocomplete-wrap">
                    <input type="text" id="from-input" class="stop-input" placeholder="e.g. Railway Station" autocomplete="off"/>
                    <div id="from-dropdown" class="dropdown hidden"></div>
                </div>
                <div id="from-selected" class="selected-stop hidden"></div>
            </div>

            <!-- Swap Button -->
            <button class="swap-btn" id="swap-btn" title="Swap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>
                </svg>
            </button>

            <!-- TO -->
            <div class="input-group">
                <label class="input-label">
                    <span class="stop-marker to-marker">B</span>
                    TO
                </label>
                <div class="autocomplete-wrap">
                    <input type="text" id="to-input" class="stop-input" placeholder="e.g. ISBT Dehradun" autocomplete="off"/>
                    <div id="to-dropdown" class="dropdown hidden"></div>
                </div>
                <div id="to-selected" class="selected-stop hidden"></div>
            </div>

            <button class="search-btn" id="search-btn">
                <span id="search-btn-text">SEARCH TRANSPORT</span>
                <span id="search-spinner" class="spinner hidden"></span>
            </button>
        </div>

        <!-- Results -->
        <div id="results-area" class="results-area"></div>

    </aside>

    <!-- Map -->
    <main class="map-wrap">
        <div id="map"></div>
        <div class="map-watermark">DEHRADUN TRANSPORT NETWORK</div>
        <div id="refresh-badge" class="refresh-badge hidden">↻ LIVE UPDATE</div>
    </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script src="/static/cityflow.js?v=6"></script>
</body>
</html>
